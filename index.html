<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma to Tailwind</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body>
    <!-- Top Header Start -->
    <div class="py-3 border-b border-[#E6E6E6]">
      <div class="max-w-mContainer m-auto">
        <div
          class="flex justify-between items-center gap-x-32 text-[12px] font-poppins text-tophead"
        >
          <div class="">
            <p>
              <i class="ti ti-map-pin text-[18px] mr-2"></i>Store Location:
              Lincoln- 344, Illinois, Chicago, USA
            </p>
          </div>
          <div class="flex items-center">
            <a href="#" class="mr-2"
              >Eng<i class="relative top-0.5 ti ti-chevron-down text-[15px]"></i
            ></a>
            <a href="#"
              >USD<i class="relative top-0.5 ti ti-chevron-down text-[15px]"></i
            ></a>
            <span class="mx-3 text-[#CCCCCC]">|</span>
            <a href="#">Sign In</a>
            <span class="mx-3">/</span>
            <a href="#">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
    <!-- Top Header End -->
    <!-- Bottom Header Start -->
    <div class="py-7 font-poppins">
      <div class="max-w-mContainer m-auto">
        <div class="flex items-center justify-between">
          <div class="">
            <img src="images/logo.png" alt="logo.png" />
          </div>
          <div class="relative">
            <i
              class="ti ti-zoom absolute left-5 top-1/2 text-[20px] -translate-1/2"
            ></i>
            <input
              type="text"
              class="py-3 pl-9 pr-4 border border-[#E6E6E6] w-100 rounded-l-md"
              placeholder="Search"
            />
            <button
              type="button"
              class="absolute bg-[#00B207] text-white rounded-r-md py-3.5 px-4 top-0 right-0 font-semibold text-[14px] font-poppins cursor-pointer"
            >
              Search
            </button>
          </div>
          <div class="flex items-center gap-x-2">
            <div class="text-[24px]">
              <i class="ti ti-heart"></i>
              <span class="mx-1 text-[#CCCCCC] font-extralight">|</span>
              <i class="ti ti-shopping-bag"></i>
            </div>
            <div class="">
              <h3 class="text-[11px] text-[#4D4D4D]">Shopping cart:</h3>
              <h4 class="text-[14px] font-medium text-[#1A1A1A]">$57.00</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bottom Header End -->
    <!-- Navbar Part Start -->
    <div class="bg-[#333] py-6 font-poppins">
      <div class="max-w-mContainer m-auto">
        <div class="flex justify-between items-center">
          <div class="">
            <ul
              class="flex gap-x-4 items-center text-[#999] font-medium text-[14px]"
            >
              <li>
                <a href="#" class="hover:text-white duration-300"
                  >Home
                  <i
                    class="ti ti-chevron-down text-[20px] relative top-0.75"
                  ></i
                ></a>
              </li>
              <li>
                <a href="#" class="hover:text-white duration-300"
                  >Shop
                  <i
                    class="ti ti-chevron-down text-[20px] relative top-0.75"
                  ></i
                ></a>
              </li>
              <li>
                <a href="#" class="hover:text-white duration-300"
                  >Pages
                  <i
                    class="ti ti-chevron-down text-[20px] relative top-0.75"
                  ></i
                ></a>
              </li>
              <li>
                <a href="#" class="hover:text-white duration-300"
                  >Blog
                  <i
                    class="ti ti-chevron-down text-[20px] relative top-0.75"
                  ></i
                ></a>
              </li>
              <li>
                <a href="#" class="hover:text-white duration-300">About us</a>
              </li>
              <li>
                <a href="#" class="hover:text-white duration-300">Contact us</a>
              </li>
            </ul>
          </div>
          <div class="text-white flex gap-x-2 items-center">
            <i class="ti ti-phone-call"></i>
            <h3>(219) 555-0114</h3>
          </div>
        </div>
      </div>
    </div>
    <!-- Navbar Part End -->

    <!-- Banner Part Start -->
    <div class="py-5">
      <div class="max-w-mContainer m-auto">
				<div class="flex justify-center items-center gap-x-6">
					<div>
						<img src="images/banner-1.png" alt="banner-1.png">
					</div>
					<div class="flex flex-col gap-y-6">
						<img src="images/banner-3.png" alt="banner-3.png">
						<img src="images/banner-2.png" alt="banner-2.png">
					</div>
				</div>
			</div>
    </div>
    <!-- Banner Part End -->
  </body>
</html>
